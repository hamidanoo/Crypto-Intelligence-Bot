# Crypto Intelligence — single-VPS Docker deployment (Phase 10, Stage A).
#
# Networking rule: ONLY Nginx publishes public ports (80/443).
# PostgreSQL, Redis, backend, and frontend are bound to
# 127.0.0.1, so they are reachable from the host for checks
# but never from the network. All services share one named
# bridge network (app_net) for internal DNS only; there is
# no published port that reaches an internal service.
#
# Scheduler rule: exactly ONE backend service runs the
# scheduler (see app/scheduler.py). Never scale backend or
# bot to more than one replica: a second scheduler would
# double-collect and double-notify. See
# docs/PRODUCTION_DEPLOYMENT_GUIDE.md.
#
# Migrations: ONLY the backend service runs them, via
# backend/entrypoint.sh (`alembic upgrade head` with
# `set -e`). The bot's entrypoint is cleared so it cannot
# race the backend on the same database. If migrations
# fail, the backend container exits and the API is never
# exposed with a stale schema.
#
# Nginx config: NGINX_CONFIG_FILE selects the mounted
# config. Local development uses ./nginx/nginx.conf
# (HTTP only). Production uses ./nginx/production.conf
# (HTTP -> HTTPS redirect + TLS) and requires real
# certificates in the certbot_certs volume; see
# scripts/setup-https.sh. Do NOT serve production traffic
# through the HTTP-only config.
#
# Resource limits below are starting values, not measured
# minima: adjust them from real VPS observations.
#
# NOTE: Docker was not available in the Stage A
# environment, so this file is validated by parsing and
# review, not by a live `docker compose up` run. That run
# is a Stage B task (docs/PRODUCTION_CHECKLIST.md).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_intelligence}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # No --appendonly change here: the application treats
    # Redis as a cache with an in-memory fallback, so a
    # restart that drops cached entries is safe. If Redis
    # later becomes a queue, revisit persistence here.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto}@postgres:5432/${POSTGRES_DB:-crypto_intelligence}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000,http://localhost
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  bot:
    build: ./backend
    restart: unless-stopped
    # Clear the image entrypoint: the backend image's
    # entrypoint runs migrations, and the bot must not
    # run them concurrently with the backend.
    entrypoint: []
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crypto}:${POSTGRES_PASSWORD:-crypto}@postgres:5432/${POSTGRES_DB:-crypto_intelligence}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_GROUP_ID: ${TELEGRAM_GROUP_ID:-}
    command: ["python", "-m", "app.bot"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - app_net
    logging: *default-logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONFIG_FILE:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app_net
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10

  # One-off certificate tool, started only explicitly:
  #   docker compose --profile certbot run --rm certbot certonly \
  #     --webroot -w /var/www/certbot -d YOUR_DOMAIN --email you@example.com --agree-tos
  # See scripts/setup-https.sh. Never started by `docker compose up`.
  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - app_net

volumes:
  postgres_data:
  redis_data:
  certbot_certs:
  certbot_webroot:

networks:
  app_net:
    driver: bridge

# Production Nginx configuration — Phase 10, Stage A.
#
# HOW TO USE (Stage B only, never for an invented domain):
# 1. Replace YOUR_DOMAIN below with the real domain (see
#    docs/PRODUCTION_DEPLOYMENT_GUIDE.md, DNS section).
# 2. Obtain certificates with scripts/setup-https.sh, which
#    writes them to /etc/letsencrypt/live/YOUR_DOMAIN/.
# 3. Set NGINX_CONFIG_FILE=./nginx/production.conf in the
#    deployment environment and restart Nginx.
# 4. ONLY AFTER an HTTPS request succeeds, enable HSTS by
#    uncommenting the add_header line marked HSTS below
#    and reloading Nginx. HSTS must never be enabled on an
#    HTTP-only setup: browsers would then refuse plain
#    HTTP forever for this domain, including during a
#    certificate outage.
#
# This file is a template: it is NOT mounted by default.
# docker-compose.yml mounts ./nginx/nginx.conf (HTTP,
# local development) unless NGINX_CONFIG_FILE is set.

events {}

http {
    # Request-size limit: admin uploads and API bodies in
    # this application are small; 10 MB is generous and
    # bounds abusive requests.
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # TLS: 1.2 and 1.3 only, with a modern cipher list.
    # Prefer server ciphers; disable session tickets so a
    # ticket-key compromise cannot decrypt past sessions.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — DO NOT UNCOMMENT until HTTPS is verified
    # (see the header comment above). Once enabled, it
    # applies for one year including subdomains.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # HTTP -> HTTPS redirect. The /.well-known/ path is
    # exempt so Let's Encrypt HTTP-01 challenges can be
    # served from the certbot webroot volume.
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS application server.
    server {
        listen 443 ssl;
        server_name YOUR_DOMAIN;

        ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

        # Proxy timeouts: the backend serves local data
        # and short Binance calls; 60s bounds a hung
        # upstream instead of holding a connection open.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forwarded headers: the backend uses these only
        # when TRUSTED_PROXIES includes the proxy address
        # (see app/auth/client_ip.py); untrusted forwarded
        # headers from public clients are never trusted.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Safe error handling: generic pages, no version
        # disclosure from Nginx itself.
        server_tokens off;
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
        }

        location / {
            proxy_pass http://frontend:3000;
        }
    }
}

events {}

http {
    # Local-development config (HTTP only). Production must
    # use nginx/production.conf via NGINX_CONFIG_FILE (see
    # docs/PRODUCTION_DEPLOYMENT_GUIDE.md). Never serve
    # production traffic through this file.
    client_max_body_size 10m;

    server {
        listen 80;

        # Let's Encrypt HTTP-01 challenges (certbot
        # webroot volume). Served in both configs so a
        # certificate can be obtained before switching to
        # the production config.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
